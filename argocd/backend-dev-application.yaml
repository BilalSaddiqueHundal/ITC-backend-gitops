apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/BilalSaddiqueHundal/ITC-backend-gitops.git
    targetRevision: main
    path: dev

  destination:
    server: https://kubernetes.default.svc
    namespace: backend-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true