apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apigateway-route
  namespace: backend-dev
spec:
  rules:
    - host: api.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apigateway
                port:
                  number: 80
