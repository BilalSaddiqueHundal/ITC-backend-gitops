apiVersion: apps/v1
kind: Deployment
metadata:
  name: messageservice
  namespace: backend-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messageservice
  template:
    metadata:
      labels:
        app: messageservice
    spec:
      containers:
        - name: messageservice
          image: your-dockerhub-username/messageservice:latest
          ports:
            - containerPort: 8080
