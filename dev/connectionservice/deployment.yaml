apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectionservice
  labels:
    app: connectionservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connectionservice
  template:
    metadata:
      labels:
        app: connectionservice
    spec:
      containers:
        - name: connectionservice
          image: docker.io/bilalsaddique/connectionservice:1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod