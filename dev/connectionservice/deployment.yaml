apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectionservice
  labels:
    app: connectionservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connectionservice
  template:
    metadata:
      labels:
        app: connectionservice
    spec:
      containers:
        - name: connectionservice
          image: docker.io/YOUR_DOCKER_USERNAME/connectionservice:1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20